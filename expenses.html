<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List Expenses</title>
  <!-- CSS Library: Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Expense Tracker</a>
      <div class="navbar-nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="add.html">Add</a>
        <a class="nav-link active" href="expenses.html">Expenses</a>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Expenses List</h2>
      <a href="add.html" class="btn btn-success">+ Add New Expense</a>
    </div>

    <div class="card shadow-sm p-4">
      <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Title</th>
            <th>Category</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>Coffee with friends</td>
            <td><span class="badge bg-info">Food</span></td>
            <td>350 Lek</td>
          </tr>
          <tr>
            <td>2</td>
            <td>Bus Ticket</td>
            <td><span class="badge bg-warning text-dark">Transport</span></td>
            <td>100 Lek</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- JavaScript Library: Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</body>
</html>
