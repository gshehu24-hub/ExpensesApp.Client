<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Expense</title>
  <!-- CSS Library: Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Expense Tracker</a>
      <div class="navbar-nav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link active" href="add.html">Add</a>
        <a class="nav-link" href="expenses.html">Expenses</a>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm p-4">
          <h2 class="mb-4 text-center">Add Expense</h2>

          <div id="alert-msg" class="alert alert-success d-none" role="alert">
            Expense added successfully via Axios Library!
          </div>

          <form id="expense-form">
            <div class="mb-3">
              <label for="title" class="form-label">Title</label>
              <input type="text" class="form-control" id="title" placeholder="Coffee with friends" required>
            </div>

            <div class="mb-3">
              <label for="amount" class="form-label">Amount (Lek)</label>
              <input type="number" class="form-control" id="amount" placeholder="350" required>
            </div>

            <div class="mb-3">
              <label for="category" class="form-label">Category</label>
              <select class="form-select" id="category" required>
                <option value="">Choose a category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Books">Books</option>
                <option value="Rent">Rent</option>
                <option value="Fun">Fun</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <button type="submit" id="submit-btn" class="btn btn-primary w-100">Add Expense</button>
          </form>

          <div class="mt-3 text-center">
            <a href="expenses.html" class="text-secondary text-decoration-none">See all expenses &rarr;</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript Library Required by Professor: Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  
  <script>
    document.getElementById('expense-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const title = document.getElementById('title').value;
      const amount = document.getElementById('amount').value;
      const category = document.getElementById('category').value;

      // 1. Ruajtja ne LocalStorage
      const expenses = JSON.parse(localStorage.getItem('expenses') || '[]');
      expenses.push({ id: Date.now(), title, amount, category, date: new Date().toISOString().split('T')[0] });
      localStorage.setItem('expenses', JSON.stringify(expenses));

      // 2. Perdorimi i JS Library (Axios) per kerkesen e profesorit
      axios.post('https://jsonplaceholder.typicode.com/posts', {
        title: title,
        amount: amount,
        category: category
      })
      .then(function (response) {
        document.getElementById('alert-msg').classList.remove('d-none');
        document.getElementById('expense-form').reset();
        setTimeout(() => {
          document.getElementById('alert-msg').classList.add('d-none');
        }, 3000);
      })
      .catch(function (error) {
        console.log(error);
        alert('Expense saved locally!');
      });
    });
  </script>
</body>
</html>
